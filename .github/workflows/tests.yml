name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Test
        run: uv run --frozen pytest -q
      - name: Layout preview
        run: uv run --frozen tube-leds route --offline --size 64x32
