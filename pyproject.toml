[project]
name = "tube-leds"
version = "0.1.0"
description = "Live London Underground trains on an LED matrix. Step 1: the Bakerloo line."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "RGBMatrixEmulator>=0.20",
]

[project.scripts]
tube-leds = "tube_leds.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
